# On-demand Flutter build for the OMB_native-android mockup: run this on any
# branch to get an Android APK and web bundle as workflow artifacts without a
# local toolchain build (Gradle + NDK downloads are heavy; CI hosts have them).
# Test-only helper for the UI mockup; nothing here gates the Rust workspace.
name: omb-mockup-build
on:
  workflow_dispatch:
    inputs:
      build:
        description: What to build
        type: choice
        options:
          - apk+web
          - apk
          - web
        default: apk+web
  # Also runs on pushes that touch the mockup, so the workflow is triggerable
  # from any branch (workflow_dispatch requires the file on the default branch).
  push:
    paths:
      - OMB_native-android/**
      - .github/workflows/omb-mockup-build.yml

# The APK is published as a rolling release asset so it can be downloaded
# directly from the repo's Releases page.
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OMB_native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Pin to the exact local toolchain so CI output matches local runs.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK
        if: ${{ inputs.build != 'web' }}
        run: flutter build apk --release
      - name: Build web bundle
        if: ${{ inputs.build != 'apk' }}
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build != 'web' }}
        with:
          name: omb-android-apk
          path: OMB_native-android/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build != 'apk' }}
        with:
          name: omb-web-bundle
          path: OMB_native-android/build/web
      # Publish the APK as a rolling prerelease asset so it is downloadable
      # directly from the repo's Releases page (fixed tag, always current).
      - name: Publish APK to release
        if: ${{ inputs.build != 'web' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete omb-mockup-latest --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create omb-mockup-latest \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "OpenMausBot mockup APK (latest)" \
            --notes "Rolling Android APK built from ${GITHUB_SHA::8} by omb-mockup-build. Install with: adb install app-release.apk (or open the file on your device after allowing installs from this source)." \
            build/app/outputs/flutter-apk/app-release.apk
