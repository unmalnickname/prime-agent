# On-demand test build: run this on any branch to get a runnable binary as a
# workflow artifact without a local toolchain build. Test-only helper.
name: build-test
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Same pinned SHA as continuous.yml: this action version hard-codes 1.98.1.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
      - name: Build
        run: cargo build --release --locked -p pa-cli --bin prime-agent
      - uses: actions/upload-artifact@v4
        with:
          name: prime-agent-macos-arm64
          path: target/release/prime-agent
